# =============================================================================
# Сборка мультиарх-образа usque и публикация в реестры.
#
#   merge request        → сборка под архитектуру раннера, без публикации
#   ветка по умолчанию   → тесты + мультиарх-образ в GitLab Container Registry
#   тег (v1.2.3)         → то же + версионные теги (и Docker Hub, если настроен)
#
# Требования к раннеру: разрешённые privileged-сервисы (сборка идёт через docker:dind).
# QEMU в образ не зашит: бинарник usque кросс-компилируется Go, эмуляция нужна
# только для `apk add` в финальной стадии — поэтому binfmt ставится лишь там,
# где собирается чужая архитектура.
# =============================================================================

stages:
  - test
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DIND_IMAGE: docker:27-dind
  CLI_IMAGE: docker:27-cli
  BUILD_PLATFORMS: "linux/amd64,linux/arm64,linux/arm/v7"
  USQUE_REF: "main"
  CACHE_REF: "$CI_REGISTRY_IMAGE:cache"
  # локальное имя образа для тестов (Makefile по умолчанию собирает usque:local)
  TEST_IMAGE: "usque:ci"

# Клиент docker в job-контейнере + демон в сервисе.
.docker:
  image: $CLI_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"

# ------------------------------------------------------------------ проверки
# Сеть не нужна: конфиг фиктивный (endpoint 127.0.0.1), маршрутизация — в netns.
# Важно: пути через -v работают потому, что GitLab Runner прокидывает тома
# job-контейнера и в сервис dind.
tests:
  extends: .docker
  stage: test
  variables:
    TESTCFG: "$CI_PROJECT_DIR/.testcfg"
  before_script:
    - apk add --no-cache make bash
  script:
    - make test-config TESTCFG="$TESTCFG" IMAGE="$TEST_IMAGE"
    - make test-routes IMAGE="$TEST_IMAGE"
    - make test-modes TESTCFG="$TESTCFG" IMAGE="$TEST_IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------- MR: просто собрать
build:check:
  extends: .docker
  stage: build
  script:
    - docker build --build-arg USQUE_REF="$USQUE_REF" -t "$TEST_IMAGE" .
    - docker run --rm --entrypoint usque "$TEST_IMAGE" version
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ------------------------------------------- релиз: мультиарх + публикация
build:release:
  extends: .docker
  stage: build
  before_script:
    # без этого мультиарх-сборка упадёт на первом RUN чужой архитектуры
    - docker run --privileged --rm tonistiigi/binfmt --install all
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container --name ci >/dev/null
    - docker buildx inspect --bootstrap >/dev/null
    # --- теги: GitLab Container Registry ---
    - |
      TAGS="--tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --tag $CI_REGISTRY_IMAGE:latest"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
    # --- теги: Docker Hub (если заданы DOCKERHUB_USER и DOCKERHUB_TOKEN) ---
    - |
      if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        HUB_IMAGE="$DOCKERHUB_USER/${DOCKERHUB_REPO:-usque}"
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
        TAGS="$TAGS --tag $HUB_IMAGE:latest"
        if [ -n "$CI_COMMIT_TAG" ]; then
          TAGS="$TAGS --tag $HUB_IMAGE:$CI_COMMIT_TAG"
        fi
        echo "Docker Hub: публикую $HUB_IMAGE"
      else
        echo "Docker Hub: DOCKERHUB_USER/DOCKERHUB_TOKEN не заданы — только GitLab"
      fi
    - |
      docker buildx build \
        --platform "$BUILD_PLATFORMS" \
        --build-arg USQUE_REF="$USQUE_REF" \
        --cache-from "type=registry,ref=$CACHE_REF" \
        --cache-to "type=registry,ref=$CACHE_REF,mode=max" \
        $TAGS --push .
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
